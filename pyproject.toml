[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-orchestrator-core"
version = "0.1.0"
description = "Evidence-based experience and Skill memory evolution"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5", "openai>=2.54,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_orchestrator*"]

[tool.setuptools.package-data]
memory_orchestrator = ["schemas.json", "prompts.json"]
