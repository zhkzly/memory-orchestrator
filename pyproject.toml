[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-orchestrator"
version = "0.2.0"
description = "A local Python memory core for evidence-backed experience and Skill updates."
requires-python = ">=3.11"
dependencies = ["openai>=2.54,<3", "jsonschema>=4.26,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_orchestrator*"]

[tool.setuptools.package-data]
memory_orchestrator = ["data/*.json"]
